<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Xác Thực OTP - Nhà Trọ Adou</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <div style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; box-sizing: border-box;">
        <h2 style="text-align: center; color: #333; margin-bottom: 20px;">Xác Thực OTP</h2>
        <p style="color: #28a745; font-size: 14px; text-align: center; margin-bottom: 20px; font-weight: bold;">
            🎉 Mã OTP đã được gửi! Vui lòng kiểm tra Gmail của bạn.
        </p>

        <form th:action="@{/quen-mat-khau/dat-lai-mat-khau}" method="post">
            <input type="hidden" name="email" th:value="${email}" />

            <div style="margin-bottom: 15px;">
                <label style="display: block; font-size: 14px; margin-bottom: 5px; color: #555;">Mã OTP (6 số):</label>
                <input type="text" name="maOTP" placeholder="Nhập 6 số OTP" required maxlength="6"
                       style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 16px; text-align: center; letter-spacing: 5px; font-weight: bold;"/>
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; font-size: 14px; margin-bottom: 5px; color: #555;">Mật khẩu mới:</label>
                <input type="password" name="matKhauMoi" placeholder="Nhập mật khẩu mới" required 
                       style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px;"/>
            </div>

            <button type="submit" style="width: 100%; padding: 12px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer;">
                Xác nhận đổi mật khẩu
            </button>
        </form>
    </div>

</body>
</html>
