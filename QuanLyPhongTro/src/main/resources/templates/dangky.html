<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký Tài Khoản - Hệ Thống Nhà Trọ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
		body { 
		    font-family: 'Segoe UI', Arial, sans-serif; 
		    /* 🟢 Thay vì dùng màu đơn sắc cũ, cậu đổi thành dòng này: */
		    background: url('/images/background.jpg') no-repeat center center fixed; 
		    background-size: cover; /* Giúp ảnh tự động co giãn phủ kín toàn màn hình */
		    min-height: 100vh;
		    display: flex;
		    justify-content: center;
		    align-items: center;
		    padding: 20px;
		}
        .form-container { 
            background: white; 
            padding: 40px 30px; 
            width: 100%;
            max-width: 420px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08); 
        }
        h2 { 
            color: #2c3e50; 
            margin-bottom: 25px; 
            font-size: 26px;
            font-weight: 700;
        }
        .alert-box {
            text-align: center; 
            margin-bottom: 20px;
        }
        .alert-danger {
            color: #c0392b; 
            background-color: #fce4d6; 
            padding: 12px; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 14px;
            border: 1px solid #f5b7b1;
        }
        .form-group {
            margin-bottom: 18px;
            text-align: left;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #7f8c8d;
            font-size: 14px;
            font-weight: 600;
        }
        input { 
            width: 100%; 
            padding: 12px 15px; 
            border: 1px solid #ccc; 
            border-radius: 6px; 
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            background-color: #fbfbfb;
        }
        input:focus {
            border-color: #2ecc71;
            background-color: white;
            box-shadow: 0 0 8px rgba(46, 204, 113, 0.2);
        }
        button { 
            width: 100%; 
            padding: 14px; 
            background-color: #2ecc71; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.2);
        }
        button:hover { 
            background-color: #27ae60; 
        }
        button:active {
            transform: scale(0.98);
        }
        .footer-text {
            margin-top: 25px;
            font-size: 14px;
            color: #7f8c8d;
        }
        .footer-text a {
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Đăng Ký Khách Thuê</h2>
        
        <div class="alert-box">
            <div th:if="${param.loi_trung_ten}" class="alert-danger">
                ❌ Tên đăng nhập này đã có người sử dụng!
            </div>
            <div th:if="${param.loi_trung_email}" class="alert-danger" style="margin-top: 5px;">
                ❌ Địa chỉ Email này đã được đăng ký trước đó!
            </div>
        </div>
		
        <form th:action="@{/dangky}" th:object="${nguoiDung}" method="post">
            <div class="form-group">
                <label>Email cá nhân:</label>
                <input type="email" th:field="*{email}" placeholder="Ví dụ: nhatroadou@gmail.com" required/>
            </div>
            <div class="form-group">
                <label>Tên đăng nhập:</label>
                <input type="text" th:field="*{tenDangNhap}" placeholder="Nhập tên tài khoản" required />
            </div>
            <div class="form-group">
                <label>Mật khẩu:</label>
                <input type="password" th:field="*{matKhau}" placeholder="Nhập mật khẩu bảo mật" required />
            </div>
            <div class="form-group">
                <label>Họ và tên:</label>
                <input type="text" th:field="*{hoVaTen}" placeholder="Nhập đầy đủ họ tên" required />
            </div>
            <div class="form-group">
                <label>Số điện thoại:</label>
                <input type="text" th:field="*{soDienThoai}" placeholder="Nhập số điện thoại liên lạc" required />
            </div>
            <button type="submit">Đăng Ký Ngay</button>
        </form>
        <p class="footer-text">Đã có tài khoản rồi? <a href="/dangnhap">Quay lại Đăng nhập</a></p>
    </div>
</body>
</html>
