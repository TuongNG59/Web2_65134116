<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Đăng Ký Tài Khoản</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; text-align: center; padding-top: 50px; }
        .form-container { background: white; padding: 30px; width: 300px; margin: auto; border-radius: 8px; box-shadow: 0px 0px 10px #ccc; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #2ecc71; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Đăng Ký Khách Thuê</h2>
        <div style="text-align: center; margin-bottom: 15px;">
    
   		 <div th:if="${param.loi_trung_ten}" style="color: #721c24; background-color: #f8d7da; padding: 10px; border-radius: 5px; font-weight: bold; font-size: 14px;">
        	❌ Tên đăng nhập này đã có người sử dụng. Vui lòng chọn tên khác!
    	</div>

    	<div th:if="${param.loi_trung_email}" style="color: #721c24; background-color: #f8d7da; padding: 10px; border-radius: 5px; font-weight: bold; font-size: 14px;">
        	❌ Địa chỉ Email này đã được liên kết với một tài khoản khác!
    	</div>

		</div>
		
        <form th:action="@{/dangky}" th:object="${nguoiDung}" method="post">
        	<input type="email" th:field="*{email}" placeholder="Địa chỉ Gmail cá nhân" required/>
            <input type="text" th:field="*{tenDangNhap}" placeholder="Tên đăng nhập" required />
            <input type="password" th:field="*{matKhau}" placeholder="Mật khẩu" required />
            <input type="text" th:field="*{hoVaTen}" placeholder="Họ và tên" required />
            <input type="text" th:field="*{soDienThoai}" placeholder="Số điện thoại" required />
            <button type="submit">Đăng Ký</button>
        </form>
        <p>Đã có tài khoản? <a href="/dangnhap">Quay lại Đăng nhập</a></p>
    </div>
</body>
</html>
