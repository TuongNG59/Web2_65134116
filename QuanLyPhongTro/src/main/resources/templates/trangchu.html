<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Trang Chủ - Quản Lý Phòng Trọ!</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; }
        h1 { color: #2c3e50; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { padding: 15px; text-align: center; border-bottom: 1px solid #ddd; }
        th { background-color: #3498db; color: white; }
        .btn-thue { background-color: #2ecc71; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h1>HỆ THỐNG QUẢN LÝ PHÒNG TRỌ</h1>
    <h2 style="text-align: center; color: #7f8c8d;">Danh sách phòng đang trống</h2>

    <table>
        <thead>
            <tr>
                <th>Mã Phòng</th>
                <th>Tên Phòng</th>
                <th>Diện Tích</th>
                <th>Giá Thuê / Tháng</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="phong : ${danhSachPhong}">
                <td th:text="${phong.id}">1</td>
                <td th:text="${phong.tenPhong}" style="font-weight: bold;">Phòng 101</td>
                <td th:text="${phong.dienTich} + ' m²'">20 m²</td>
                <td th:text="${#numbers.formatDecimal(phong.giaCoBan, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'" style="color: red; font-weight: bold;">2,000,000 VNĐ</td>
				<td>
				    <form th:action="'/thue-phong/' + ${phong.id}" method="post">
				        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
				        
				        <button type="submit" class="btn-thue">Gửi Yêu Cầu Thuê</button>
				    </form>
				</td>
            </tr>
            
            <tr th:if="${#lists.isEmpty(danhSachPhong)}">
                <td colspan="5" style="color: red; font-style: italic;">Hiện tại không có phòng nào trống!</td>
            </tr>
        </tbody>
    </table>

</body>
</html>
