<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Chi Tiết Tài Khoản</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 40px; }
        .profile-box { max-width: 600px; background: white; margin: auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; text-align: center; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .info-group { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
        .info-label { font-weight: bold; color: #7f8c8d; display: inline-block; width: 150px; }
        .info-value { color: #2c3e50; font-weight: bold; }
        .img-cccd { width: 100%; max-width: 260px; height: auto; border-radius: 6px; border: 1px solid #ddd; margin-top: 5px; }
        .cccd-container { display: flex; gap: 20px; margin-top: 10px; }
        .btn-back { display: inline-block; background-color: #7f8c8d; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; font-weight: bold; margin-top: 20px; }
        .btn-back:hover { background-color: #95a5a6; }
    </style>
</head>
<body>

    <div class="profile-box">
        <h2>HỒ SƠ KHÁCH THUÊ</h2>
        
        <div class="info-group">
            <span class="info-label">Tên đăng nhập:</span>
            <span class="info-value" th:text="${khachHang.tenDangNhap}">User1</span>
        </div>
        
        <div class="info-group">
            <span class="info-label">Họ và Tên:</span>
            <span class="info-value" th:text="${khachHang.hoVaTen}">Nguyễn Văn A</span>
        </div>
        
        <div class="info-group">
            <span class="info-label">Email:</span>
            <span class="info-value" th:text="${khachHang.email}">email@gmail.com</span>
        </div>
        
        <div class="info-group">
            <span class="info-label">Số điện thoại:</span>
            <span class="info-value" th:text="${khachHang.soDienThoai != null ? khachHang.soDienThoai : 'Chưa cập nhật'}">0905...</span>
        </div>
        
        <div class="info-group">
            <span class="info-label">Số CCCD:</span>
            <span class="info-value" th:text="${khachHang.cccd != null ? khachHang.cccd : 'Chưa cập nhật'}">123456...</span>
        </div>
        
        <div class="info-group">
            <span class="info-label">Địa chỉ nguyên quán:</span>
            <span class="info-value" th:text="${khachHang.diaChi != null ? khachHang.diaChi : 'Chưa cập nhật'}">Nha Trang...</span>
        </div>

        <div class="info-group">
            <span class="info-label">Phòng đang thuê:</span>
            <span class="info-value" th:text="${khachHang.phongTro != null ? khachHang.phongTro.tenPhong : '🏠 Chưa nhận phòng'}">Phòng 101</span>
        </div>
        
        <div class="info-group" style="margin-top: 20px;">
            <span class="info-label" style="width: 100%;">Hình ảnh CCCD minh chứng:</span>
            <div class="cccd-container">
                <div>
                    <p style="font-size: 13px; margin: 5px 0; color: #555;">Mặt trước:</p>
                    <img th:if="${khachHang.anhCccdTruoc != null}" th:src="@{'/images/uploads/' + ${khachHang.anhCccdTruoc}}" class="img-cccd" alt="Mặt trước CCCD"/>
                    <div th:if="${khachHang.anhCccdTruoc == null}" style="background: #eee; width: 260px; height: 160px; display:flex; align-items:center; justify-content:center; color:#888; font-size:13px; border-radius:6px;">Chưa tải ảnh</div>
                </div>
                <div>
                    <p style="font-size: 13px; margin: 5px 0; color: #555;">Mặt sau:</p>
                    <img th:if="${khachHang.anhCccdSau != null}" th:src="@{'/images/uploads/' + ${khachHang.anhCccdSau}}" class="img-cccd" alt="Mặt sau CCCD"/>
                    <div th:if="${khachHang.anhCccdSau == null}" style="background: #eee; width: 260px; height: 160px; display:flex; align-items:center; justify-content:center; color:#888; font-size:13px; border-radius:6px;">Chưa tải ảnh</div>
                </div>
            </div>
        </div>

        <div style="text-align: center;">
            <a href="/admin/tai-khoan" class="btn-back">⬅ Quay lại danh sách</a>
        </div>
    </div>

</body>
</html>
