<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng Nhập Hệ Thống</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; text-align: center; padding-top: 50px; }
        .form-container { background: white; padding: 30px; width: 300px; margin: auto; border-radius: 8px; box-shadow: 0px 0px 10px #ccc; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; background-color: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Đăng Nhập</h2>
        
        <div th:if="${param.error}" style="color: red; margin-bottom: 10px;">Sai tên đăng nhập hoặc mật khẩu!</div>
        <div th:if="${param.thanhcong}" style="color: green; margin-bottom: 10px;">Đăng ký thành công! Hãy đăng nhập.</div>

        <form th:action="@{/xuly-dangnhap}" method="post">
            <input type="text" name="username" placeholder="Tên đăng nhập" required />
            <input type="password" name="password" placeholder="Mật khẩu" required />
            <button type="submit">Đăng Nhập</button>
        </form>
        <p>Chưa có tài khoản? <a href="/dangky">Đăng ký ngay</a></p>
    </div>
</body>
</html>
