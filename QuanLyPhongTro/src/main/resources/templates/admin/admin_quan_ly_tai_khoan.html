<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin - Quản Lý Tài Khoản</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f7f6; }
        h1 { color: #2c3e50; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        th, td { padding: 12px; text-align: center; border-bottom: 1px solid #ddd; }
        th { background-color: #2c3e50; color: white; }
        .badge-active { background-color: #2ecc71; color: white; padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-locked { background-color: #e74c3c; color: white; padding: 5px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .btn-action { text-decoration: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; font-size: 13px; color: white; }
    </style>
</head>
<body>

    <div style="margin-bottom: 20px;">
        <a href="/" style="text-decoration: none; color: #3498db; font-weight: bold;">⬅ Quay lại Trang Chủ</a>
    </div>

    <h1>👥 QUẢN LÝ TÀI KHOẢN NGƯỜI DÙNG</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Tên Đăng Nhập</th>
                <th>Họ Và Tên</th>
                <th>Số Điện Thoại</th>
                <th>Email</th>
                <th>Vai Trò</th>
                <th>Trạng Thái</th>
                <th>Thao Tác</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${danhSachNguoiDung}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.tenDangNhap}" style="font-weight: bold;">user1</td>
                <td th:text="${user.hoVaTen}">Nguyễn Văn A</td>
                <td th:text="${user.soDienThoai}">0901234567</td>
                <td th:text="${user.email}">user1@gmail.com</td>
                <td th:text="${user.vaiTro}" style="color: #2980b9; font-weight: bold;">USER</td>
                <td>
                    <span th:if="${user.trangThai}" class="badge-active">Đang Hoạt Động</span>
                    <span th:if="${!user.trangThai}" class="badge-locked">Bị Khóa / Chưa kích hoạt</span>
                </td>
                <td>
                    <a th:href="@{/admin/tai-khoan/doi-trang-thai/{id}(id=${user.id})}" 
   					   th:style="${user.trangThai} ? 'background-color: #e74c3c; padding: 6px 12px; border-radius: 4px; text-decoration: none; color: white;' : 'background-color: #2ecc71; padding: 6px 12px; border-radius: 4px; text-decoration: none; color: white;'"
                       th:text="${user.trangThai} ? '🔒 Khóa Tài Khoản' : '🔓 Mở Khóa'">
   						Thao tác
					</a>
                </td>
            </tr>
        </tbody>
    </table>

</body>
</html>
